name: Update the walkthrough table

# Every push that touches a room rebuilds the table in README.md from the room headers,
# so a new room never has to be added to the table by hand.
on:
  push:
    branches: [main]
    paths:
      - 'Room/**'
      - '.github/scripts/update-readme.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-table
  cancel-in-progress: false

jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the table
        run: node .github/scripts/update-readme.mjs
      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: walkthrough table updated"
          git push
